# weapon_tech.cfg: a commented sample in the sectioned layout (format v2).
# Put it next to weapon_tech.dll in usermaps\<map>\zone\. Every key: docs/CONFIG_REFERENCE.md.
#
# [features] switches whole features; each other section holds one feature's lines. Inside a section the feature
# prefix can be left out (key = I in [inspect] is inspect_key=I); full key names work everywhere. Lines up to 255
# characters. The weapon names below are examples: use your map's weapon variant names.

[features]
additives   = on      # additive layers (empty / recoil / bullet, purpose slots)
ammo_hide   = on      # spent rounds hide as the clip empties
kick        = on      # IW8 weapon offset patterns + kick springs
kick_return = off     # IW8 view-kick return
camera      = on      # camera shake scale, IW8 camera anims
locomotion  = on      # walk / jog / idle_active / sway
inspect     = on      # MW-style inspect
last_shot   = auto    # empty layer on the last shot: auto | iw | hold
empty_melee = on      # an empty gun keeps its own melee and normal raise / drop
interrupts  = off     # experimental
segreload   = on      # empty variants of shell-by-shell reloads
slide       = off     # MW2019 slide, map-wide
vmfov       = off     # viewmodel FOV pin: off | mw | <degrees>
ik          = off     # experimental hand IK

[general]
perf_hotlog = 0       # 1 = per-shot debug lines in weapon_tech.log
# cfg_dump = 1        # write the parsed state to weapon_tech.cfgdump.txt (compare two cfgs)

[additives]
# additive=<gun>,<empty|recoil|bullet>,<193|195>,<xanim>[,<weight>[,<mag size (bullet) | rate (recoil)>]]
additive=pistol_decho_kar_zm,empty,193,vm_p25_pi_decho_empty_additive,1.0
additive=pistol_decho_kar_zm,bullet,195,vm_p25_pi_decho_bullet_additive,1.0,7
additive=lmg_sierrax_kar_zm,recoil,195,vm_lm_sierrax_recoil_additive,1.0,0.94
additive=lmg_sierrax_kar_zm,bullet,193,vm_lm_sierrax_bullets_additive,1.0,99
# Purpose slots, for guns whose 193 / 195 are taken; side:left = the left gun of an akimbo pair:
# additive=pistol_mike9_kar_zm,empty,slot:empty,vm_pi_mike9_empty_additive,1.0
# additive=pistol_mike9_kar_zm,empty,slot:empty,vm_pi_mike9_l_empty_additive,1.0,side:left
# take_jukes = pistol_mike9_kar_zm      # slot layers may use the juke roots

[ammo_hide]
ammohide=lmg_sierrax_kar_zm,j_bullet011,j_bullet010,j_bullet09,j_bullet08,j_bullet07,j_bullet06,j_bullet05,j_bullet04,j_bullet03,j_bullet02,j_bullet01
# tools/ammohide_order.py writes the hide order of every bullet layer into its own block:
# ==== BEGIN generated:ammohide_order ====
[ammo_hide]
# ==== END generated:ammohide_order ====

[kick]
# IW8 data: tools/iw8_wop_cfg.py <iw8 weapon json> <gun> prints these lines. A PaP takes its base's block:
# wop_weapon=smg_charlie9_kar_zm,63
# wop_kick=smg_charlie9_kar_zm,0,0,0,0,30,44,44,1
# wop=smg_charlie9_kar_zm,1,0,2,1,0,-0.7,-0.04,0.05,2,0,1,1,0,-1
# wop_alias=smg_charlie9_kar_upgraded_zm,smg_charlie9_kar_zm
kick_consts = iw8     # iw8 | legacy

[camera]
shake = 1,1,1         # pitch/yaw, roll, origin scale of the IW8 camera shake
free = 0              # 1 = IW8 camera anims move only the camera
# cam_shake=pistol_papa320_kar_zm,0.5,0.35,0.5,1

[locomotion]
# locomotion=<gun>,walk,bob,<strides>   idle_active=<gun>,<xanim|*>,<leaf>[,<weight>[,<rate>]]
# locomotion=smg_charlie9_kar_zm,walk,bob,4
# idle_active=smg_charlie9_kar_zm,vm_sm_charlie9_idle_active_additive,194
idle_active_fade = iw8,0.2

[inspect]
key = I               # a letter, F1..F24, MOUSE3..5 or a VK code
hidehud = 0           # 1 = fade the HUD out while inspecting
empty = in            # in | out | off: the empty inspect
guns = pistol_decho_kar_zm, lmg_sierrax_kar_zm:4.8    # <gun>[:<seconds>], <gun>:off

[segreload]
# guns = shotgun_romeo870_kar_zm:end, shotgun_romeo870_kar_upgraded_zm:off

[last_shot]
# guns = smg_psierra41_kar_zm:hold     # per-gun override of [features] last_shot

[empty_melee]
interrupt_empty_melee = 1     # the empty gun's post-melee raise stays interruptible

[slide]
# suit = iw8_defaultsuit_mp
# gesture = 1

[vmfov]
ads = fade
depth = 20

[ik]
# guns = ar_valpha_kar_zm:lr

# One gun's settings in one place, as a GDT compiler writes them (wt* keys; see the reference):
# [weapon:smg_charlie9_kar_zm]
# wtInspect = on
# wtInspectTime = 4.8
# wtFireTimeMs = 63
