## ---- Hand IK (bo3_ik.h) ------------------------------------------------------------------------------------------
## The hooks install only if an ik= line exists at game start; after that every ik line is live. ik_enable defaults to 0
## (IK only measures). ik=<weapon>,<1|0>[,l|r|lr[,noteless weight[,orient]]]; honours the anims' ik_in / ik_out notetracks.
# ik_enable=1
# ik=ar_valpha_kar_zm,1,lr
# ik_alias=ar_valpha_kar_upgraded_zm,ar_valpha_kar_zm
## ik_notes=<xanim>,<l|r>,<is|ie|os|oe>:<seconds>,...: IK in/out markers for an anim that lacks the notetracks.
# ik_notes=vm_ar_valpha_reload_additive,l,os:0.42,oe:0.80
# ik_blend=0.1
# ik_always=0
# ik_debug=1

## ---- Segmented-reload empty variants (bo3_segreload.h; restart after changes) --------------------------------------
## <weapon>,<end|mw|mw19|mw2019|start|mwii|mw2|mw22|off|0>. end = MW19 (rechamber only when the reload started empty).
# segreload_empty=shotgun_romeo870_kar_zm,end
# segreload_empty=shotgun_romeo870_kar_upgraded_zm,off
# segreload_enable=1

## ---- Inspect (bo3_inspect.h; restart after changes) ---------------------------------------------------------------
## Nothing installs without inspect_enable=1 AND at least one inspect= line. The inspect anim is the GDT's
## lowReadyLoopAnim slot. inspect=<weapon>,<1|0>[,<seconds>]; seconds overrides the GDT's lowReadyLoopTime.
# inspect_enable=1
# inspect_key=I
# inspect=ar_mike16_kar_zm,1,4.8
# inspect=ar_mike16_kar_upgraded_zm,1,4.8
# inspect=pistol_decho_kar_upgraded_zm,1,4.7
## Empty-clip inspect: in = lowReadyInAnim (default), out = lowReadyOutAnim, off = always the normal inspect.
# inspect_empty=in
## Fade the HUD out while inspecting (the crosshair always hides).
# inspect_hidehud=1
## Dual-wield guns: 1 (default) inspects them, 0 = they do not inspect.
# inspect_akimbo=1
## Debug: treat every clip as empty to preview the empty inspects.
# inspect_debug_empty=1

## ---- Interrupts (bo3_interrupt.h; restart after changes) ---------------------------------------------------------
## interrupt=<weapon>,<states>,<source chain>[,<actions>]. States: raise first_raise quick_raise empty_raise raises
## reload reload_empty reload_start reload_loop reload_end reloads rechamber all (joined by + or ,). Source chain, joined
## by |, first that resolves wins: notetrack interruptible state_timer_end fingers statetimer, a fraction (0.85 / 85%) or
## ms (850 / 850ms). Actions: fire ads sprint melee reload switch all none (default per state: see bo3_interrupt.h).
# interrupt=ar_mike16_kar_zm,reloads+raises,notetrack|statetimer
# interrupt=smg_augolf_kar_zm,reload,0.85,fire+ads+sprint
# interrupt=ar_mike16_kar_upgraded_zm,rechamber,notetrack,fire
# interrupt_enable=1
# interrupt_debug=1
# interrupt_trace=1
## Rapid melee with an empty clip: the post-melee quick raise stays a quick raise, so melee can interrupt it as with ammo.
## One code patch, independent of interrupt= lines.
# interrupt_empty_melee=1

## ---- MW2019 slide (bo3_slide.h) -------------------------------------------------------------------------------------
## OPT-IN: nothing is installed unless slide_enable=1 is present at start. Everything but slide_enable is live on a loose cfg.
# slide_enable=1
## Suit preset (iw8_defaultsuit_mp or iw8_defaultsuit), then optional SuitDef overrides (repeatable).
# slide_suit=iw8_defaultsuit_mp
# slide_suit=inTimeMs=200,inMaxSpeedScale=1.8,inAcceleration=1.8,max_time_ms=800,strafe_speed_scale=0.25,jump_speed_scale=0.55
# slide_suit=frictionScaleNormal=0.26,frictionScaleDownhill=0.1,frictionScaleUphill=0.55,frictionScaleBlocked=0.05,sprintDelayMs=300
# slide_suit=outTimeMs=500,outFrictionScaleStart=0.36,outFrictionScaleFinish=1,inAirTimeMs=100,inAirFrictionScaleStart=0.3
# slide_suit=inAirFrictionScaleFinish=1,viewBlendInTimeMs=300,viewBlendOutTimeMs=300,player_sprintSpeedScale=1.5075,player_crouchSpeedScale=0.55
## The exe-only IW8 dvars (values are the PDB defaults).
# slide_dvars=min_required_velocity=140,min_continue_velocity=50,subsequentSlideTime=1000,subsequentSlideScale=0.15,lateJumpGraceMs=300
# slide_dvars=cameraPitchOffset=15,cameraRotateTimeMs=1100,cameraAlignmentEaseMode=-1,view_angles=-3 0 -1,viewInterpType=1
# slide_dvars=stopspeed=100,friction=5.5
## Switches: ADS ends the slide; no sprint for sprintDelayMs after a slide (default 0); IW8 camera pitch ease (default 0);
## IW8 view angle blend (default 0); round instead of truncate the per-step velocity while sliding.
# slide_ads_ends=1
# slide_sprint_lock=1
# slide_camera=1
# slide_view=1
# slide_snap_round=1
## Viewmodel gesture: in / loop / out xanims in the juke slots under additive root 184 (leaves 187 / 188 / 191). Frame 0 is the
## gun's idle as the additive reference. blend = root fade in, root fade out, leaf crossfade (s).
# slide_gesture=1
# slide_gesture_nodes=187,188,191
# slide_gesture_blend=0.1,0.15,0.12
# slide_gesture_weight=1
# slide_gesture_fps=30
# slide_gesture_ref=1
## Leave one gun without the gesture layer, and keep BO3's own slide anims (swap = point them at the idle for guns with the layer).
# slide_gesture_off=minigun_kar_zm
# slide_native_anims=swap
## 1 = start / end / jump lines, 2 = per-frame speed trace, 3 = velocity probes.
# slide_debug=1

## ---- Viewmodel FOV pin (bo3_vmfov.h) ----------------------------------------------------------------------------------
## Global and OPT-IN (default off, nothing installed). The hook is only installed if vmfov is on at load; the values are live.
## vmfov=<degrees>: pin the gun at that FOV (horizontal degrees at 4:3, cg_fov's convention; 65 = the viewmodels' base FOV).
## vmfov=mw: MW2019's default (gun at the world FOV with IW8's hip pull). vmfov=off: disabled.
# vmfov=65
## fade (default): the shift fades with the ADS fraction; hold: the hip shift is kept through ADS.
# vmfov_ads=fade
## Reference depth (units, default 20) and the largest shift either way (units, default 6).
# vmfov_depth=20
# vmfov_max=6
# vmfov_debug=1

## ---- Perf and diagnostics ----------------------------------------------------------------------------------------
## perf_eventhooks and perf_cfgwatch take effect at start only. perf_pollms is 100-60000.
# perf_eventhooks=1
# perf_cfgwatch=1
# perf_pollms=2000
# perf_hotlog=0
## A timing report in the log every 10 s.
# perf_timing=1
## Slot debug (live): bind / refuse / state lines, and a dump of every szXAnims slot of each bound weapon.
# slots_debug=1
# slots_dump=1
## Skips every per-frame feature (wop, locomotion, IK, ammohide); patches slot names only.
# additive_debug=names

## Environment variables (not cfg keys): WEAPONTECH_CRASHLOG=1 logs access violations; WEAPONTECH_SKIP=a,b,... leaves
## install groups out (melee recoil anim perf ik inspect intmelee interrupt segreload slide vmfov arxan).
