# idle_active=ar_valpha_kar_upgraded_zm,vm_ar_valpha_idle_active_additive,194
## Globals: jog thresholds start,keep (speed fractions), startAng,keepAng (deg), blend, adsBlend, fireBlend (s).
# locomotion_jog=0.6,0.5,30,40,0.3,0.15,0.15
# idle_active_fade=iw8,0.2
# locomotion_enable=1
# idle_active_enable=1
# locomotion_debug=0

