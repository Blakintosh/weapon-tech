# weapon_tech.cfg: example configuration for weapon_tech.dll
#
# Every feature is OPT-IN. A weapon is untouched unless it has a line below, and a feature's global hooks are only
# installed when at least one line for it exists. Full key reference: docs/CONFIG_REFERENCE.md.
#
# How to use this file
#   * Copy it next to weapon_tech.dll as weapon_tech.cfg (a loose copy is re-read while the game runs for the keys the
#     reference marks "live"), or bake it into the map as the rawfile weapon_tech/weapon_tech.cfg (read once).
#   * The few lines directly below this header are ACTIVE: they are a minimal working sample.
#   * Everything else is a commented sample. Remove the leading "# " to turn it on, one line (or one block) at a time.
#     Lines that are prose, not samples, start with "## ".
#   * Weapons are named by VARIANT name, case-sensitive: the weapon file name as the game loads it, for example
#     ar_mike16_kar_zm (base) and ar_mike16_kar_upgraded_zm (Pack-a-Punched). A PaP is a separate weapon: give it its own
#     lines or alias it to its base gun (wop_alias=, locomotion_alias=, sway_alias=, ik_alias=).
#   * Comments must be on their own line. A trailing "# ..." on an additive= or wop* line breaks the parse.
#   * Lines are at most 255 characters. Long ammohide_order= / ammohide_spend= lists continue with "<weapon>,+,...".
#   * Unknown keys are ignored and logged once ("unknown key ... typo?"); read weapon_tech.log after the first start.

## ---- ACTIVE minimal sample ---------------------------------------------------------------------------------------
## An empty-mag additive layer for an akimbo pistol, and a recoil + bullet layer pair for an LMG, with its round joints.
## additive=<weapon>,<empty|recoil|bullet>,<193|195>,<xanim>[,<weight>[,<mag size (bullet) | rate (recoil)>]]
additive=pistol_decho_kar_zm,empty,193,vm_p25_pi_decho_empty_additive,1.0
additive=pistol_decho_kar_zm,bullet,195,vm_p25_pi_decho_bullet_additive,1.0,7
additive=lmg_sierrax_kar_zm,recoil,195,vm_lm_sierrax_recoil_additive,1.0,0.94
additive=lmg_sierrax_kar_zm,bullet,193,vm_lm_sierrax_bullets_additive,1.0,99
## ammohide=<weapon>,<joint1>,<joint2>,...: joint k is hidden while the clip holds fewer than k rounds.
ammohide=lmg_sierrax_kar_zm,j_bullet011,j_bullet010,j_bullet09,j_bullet08,j_bullet07,j_bullet06,j_bullet05,j_bullet04,j_bullet03,j_bullet02,j_bullet01

## ---- Additive layers: recoil, empty, bullet (bo3_additive.h, bo3_slots.h) --------------------------------------------
## Legacy roots: 193 (idle group) and 195 (swim group) give each gun one empty or bullet layer and one recoil layer.
## recoil rate = anim length / (clip size x fire time), so the anim spans one mag dump (MW2019 scrubs it that way).
# additive=ar_malima_kar_zm,recoil,195,vm_p56_ar_malima_recoil_additive,1.0,1.03
# additive=ar_malima_kar_zm,bullet,193,vm_p56_ar_malima_bullet_additive_30,1.0,30
## Purpose slots (slot:<purpose>) build extra additive roots from spare juke leaves, so one gun can carry more layers.
## Purposes: bullets (root 192), empty (190), recoil_ads (189), idle / recoil (the legacy 193 / 195).
# additive=ar_mike16_kar_zm,bullet,slot:bullets,vm_p01_ar_mike4_bullet_additive,1.0,30
# additive=ar_valpha_kar_zm,empty,slot:empty,vm_ar_valpha_empty_additive,1.0
## Slot layers need juke roots 185 / 186 / 189 / 190. If the gun names all four juke anims, opt in explicitly (the gun's
## jukes then stop playing; zombies guns never juke). "all" applies it to every gun.
# slots_take_jukes=ar_valpha_kar_zm
# slots_take_jukes=ar_valpha_kar_upgraded_zm
## Akimbo (dual wield): side:right is the default and follows the right gun's clip. side:left follows the LEFT gun and needs
## its own xanim keyed to the left gun's bones (tools/gen_left_additives.py makes one from the right gun's). Only the
## empty and bullets purposes have a left side; a side:left line on a non-akimbo gun stays off.
# additive=pistol_decho_kar_upgraded_zm,empty,slot:empty,vm_p25_pi_decho_akimbo_r_empty_additive,1.0
# additive=pistol_decho_kar_upgraded_zm,bullet,slot:bullets,vm_p25_pi_decho_bullet_additive,1.0,7
# additive=pistol_decho_kar_upgraded_zm,empty,slot:empty,vm_p25_pi_decho_akimbo_l_empty_additive,1.0,side:left
# additive=pistol_decho_kar_upgraded_zm,bullet,slot:bullets,vm_p25_pi_decho_akimbo_l_bullet_additive,1.0,7,side:left
## empty_lastshot: when the empty layer comes on after the last round. hold = wait for a real fire_last anim to finish,
## iw = MW2019 rule (on at once, 0.05 s blend), auto (default) = decided per gun from its anim names. Global or per weapon.
# empty_lastshot=auto
# empty_lastshot=pistol_decho_kar_zm,iw
## A/B switch for all additive layers (live). 0 fades them out.
# additive_enable=1
## Fade the held gun's own layers out during its melee states (default 0; only for a gun with its own melee anim).
# additive_melee_fade=1
## Melee with an empty clip keeps the gun's own melee and quick raise/drop instead of the empty variants.
# empty_melee_fix=1

## ---- Spent-round hide (ammohide) ---------------------------------------------------------------------------------
## ammohide_auto (default 1) hides spent rounds for any gun with a bullet line and no ammohide= line. Round joints are
## recognised by name: bullet / round / shell / j_b_<n> / j_ammo* (j_ammo_01.., left gun j_ammo_01_le). tag_ammo_* tags and
## names containing follower, linkempty or mag are not rounds. Opt a gun out with <weapon>,0.
# ammohide_auto=1
# ammohide_auto=lmg_sierrax_kar_zm,0
## For stack mags whose bullets anim parks every round on one frame, tools/ammohide_order.py writes a spend order
## (first spent first) and, for belts that reach their spent pose at different frames, per-joint spend clips.
# ==== BEGIN ammohide order (tools/ammohide_order.py) ====
# ammohide_order=smg_secho_kar_zm,j_bullet3,j_bullet2,j_bullet1
# ammohide_spend=ar_mike16_kar_zm,j_ammo_30:30,j_ammo_29:29,j_ammo_28:28
# ==== END ammohide order ====
## ammohide_spend=<weapon>,<joint>:<clip>: the joint is hidden while the clip holds <clip> rounds or fewer.
## Last resort when neither generated line fits: reverse the built-in order for one gun.
# ammohide_reverse=smg_secho_kar_zm
## Through a reload the mag shows the count the reload anim's gramien notetracks give (default 1). 0 = old behaviour.
# ammohide_reload=1
## Spent-round guard (default on): a round that the bullets anim parks more than ammohide_park units from its base
## position is hidden through the DObj hide bits, so IW / BO7 guns never show a round floating near the camera.
# ammohide_guard=1
# ammohide_park=12
## Debug: log the parked set when it changes; log the bullet bones' matrices per clip count (to design spend clips).
# ammohide_debug=1
# belt_dump=1

## ---- IW8 weapon offsets, kick, springs (bo3_wop.h, bo3_iw8kick.h) ---------------------------------------------------
## One representative block for ar_mike16_kar_zm (the full generated block has about 17 wop= lines).
## wop_weapon=<weapon>,<fire time ms>: the GDT fireTime in ms; drives the full-auto ramps and the kick-shot counter.
# wop_weapon=ar_mike16_kar_zm,74
## wop_curve=<weapon>,<curve 0-5>,blend,decay,shotDecayFrac,hold,adsBegin,adsEnd,interpIn,interpOut
# wop_curve=ar_mike16_kar_zm,0,0.5,0.25,1,0,0,0,2,2
# wop_curve=ar_mike16_kar_zm,1,0.2,0.25,1,0,0,0,2,2
# wop_curve=ar_mike16_kar_zm,2,0.06,0.2,0,0,0,0,0,0
# wop_curve=ar_mike16_kar_zm,3,0.28,0.2,0,0,0,0,0,0
# wop_curve=ar_mike16_kar_zm,4,0,0.4,0,0,0.4,0.9,6,6
# wop_curve=ar_mike16_kar_zm,5,0,0,0,0,0,0,0,0
## wop_kickpct=<weapon>,startBullets,endBullets,8 floats
# wop_kickpct=ar_mike16_kar_zm,0,100,0.2,1.5,0.2,1.5,0.2,1.5,0.2,1.5
## wop_kick=<weapon>,ads,gun,bullet,dir,dev,strengthMin,strengthMax,pitchScale (any wop_kick installs the fire hook)
# wop_kick=ar_mike16_kar_zm,0,0,0,-5,65,49,53,1
# wop_kick=ar_mike16_kar_zm,0,1,0,-180,10,50,52,1
# wop_kick=ar_mike16_kar_zm,1,0,0,-10,20,47,47,1
# wop_kick=ar_mike16_kar_zm,1,1,0,-170,1,15,17,1
## wop_spring=<weapon>,<gun 0|1>,<ads 0|1>,accel,retAccelScale,retSpeedCurveScale,maxPitch,maxYaw (replaces BO3's integrator)
# wop_spring=ar_mike16_kar_zm,0,0,2000,0.1,2,80,80
# wop_spring=ar_mike16_kar_zm,0,1,1900,0.06,5,80,80
# wop_spring=ar_mike16_kar_zm,1,0,900,0.25,2,0.25,0.4
# wop_spring=ar_mike16_kar_zm,1,1,1500,0.25,1,0.25,0.4
## wop_tilt=<weapon>,8 floats
# wop_tilt=ar_mike16_kar_zm,3,6,-5,5,2,5,-5,5
## wop=<weapon>,curve,pattern,target,freq,blendTime,mx,my,mz,hipScale,rotOffset,faScale,faBullets,faDecay,kickIndex
## (curve 0-5, pattern 0-3, target 0-3, kickIndex <= 7; up to 16 per weapon.) Patterns: progressive weapon origin / view
## origin, initial weapon / view angles, hipfire shake, ADS settle.
# wop=ar_mike16_kar_zm,1,0,2,1,0.4,-0.4,0,0.1,1.05,27,1,1,0,-1
# wop=ar_mike16_kar_zm,1,0,0,1,0,-3,0,0,0.2,0,1,1,0,-1
# wop=ar_mike16_kar_zm,3,1,3,0.15,1,0.2,0.05,0.8,1,5,1.4,3,0,0
# wop=ar_mike16_kar_zm,3,2,1,0.4,0.25,1,0.3,1.12,0.4,128,0.75,3,0,1
# wop=ar_mike16_kar_zm,3,0,2,1,0.15,-0.3,0,-0.1,1,0,0.9,3,1,2
# wop=ar_mike16_kar_zm,2,1,3,0.01,0.125,0.06,0.12,0.24,5,8,0.5,4,0,6
# wop=ar_mike16_kar_zm,4,0,2,0.02,0.15,0.35,0,0,0.5,20,1,10,0,-1
## wop_alias=<weapon>,<source>[,<fire time ms>]: the PaP takes the source block (the source must come earlier in the file)
## and, with it, the source's locomotion / sway / ik / inspect / interrupt lines.
# wop_alias=ar_mike16_kar_upgraded_zm,ar_mike16_kar_zm
# wop_alias=lmg_sierrax_kar_upgraded_zm,lmg_sierrax_kar_zm,60
## View-kick return: what the player pulls against the view kick stays in the aim when it recentres. Needs wop_kick lines.
## Global switch (default 0), then per weapon <weapon>,<0|1>[,maintain 0..1[,noDampening 0|1]] BEFORE that weapon's wop_alias.
# wop_kickreturn=1
# wop_kickreturn=ar_falima_kar_zm,1,0,1
## Kick integrator constants (live): iw8 = MW2019 values from the PDB build (default), legacy = earlier estimates.
# wop_kick_consts=iw8
## Debug (live): wop_debug=<channel 0-4>,x,y,z overrides; wop_debug_yaw=<deg> (not reset by a reload).
# wop_debug=0,0,0,0
# wop_debug_yaw=0

## ---- Camera (live) -----------------------------------------------------------------------------------------------
## cam_shake=<pitch/yaw>,<roll>,<origin>[,<pitchUp 0|1>] scales the MW camera shake; per gun with a weapon name first
## (a PaP alias inherits). pitchUp=1: the pitch only goes up.
# cam_shake=1,1,1
# cam_shake=pistol_papa320_kar_zm,0.5,0.35,0.5,1
## camera_free=<0..1>: 1 = IW8 camera anims (tag_camera moves only the camera, the gun stays put); 0 = BO3. Per gun:
## camera_free=<weapon>,<0..1>.
# camera_free=1

