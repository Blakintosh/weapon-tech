# weapon_tech.cfg: starter template. Put it next to weapon_tech.dll in usermaps\<map>\zone\.
# Every feature is listed in [features] below. A feature that is off installs nothing, even with lines in its section.
# Guns are listed by their full variant name (e.g. ar_mike16_kar_zm), case-sensitive. Nothing happens for a gun
# until you add it. Put comments on their own line. Docs: docs/QUICKSTART.md, docs/CONFIG_REFERENCE.md.

[features]
additives   = on      # additive layers: recoil, live round count (bullets), empty-gun pose
ammo_hide   = on      # spent rounds disappear from the mag as you fire
kick        = on      # IW8 kick and weapon offset patterns (wop_* lines)
kick_return = off     # IW8 view-kick return; turn on once a gun has wop_kick lines
camera      = on      # camera shake scale and IW8 camera anims
locomotion  = on      # idle_active, walk and jog loops, MW2019 sway
inspect     = on      # inspect key and empty-gun inspect
last_shot   = auto    # empty pose on the last round: auto | iw | hold
empty_melee = on      # an empty gun keeps its own melee and normal raise
interrupts  = off     # experimental: cut raises and reloads short
segreload   = on      # empty variants of shell-by-shell reloads
slide       = off     # MW2019 slide, applies to the whole map
vmfov       = off     # viewmodel FOV pin, applies to the whole map: off | mw | <degrees>
ik          = off     # experimental: hand IK

[general]
# 1 = per-shot debug lines in weapon_tech.log
perf_hotlog = 0

[additives]
# additive=<gun>,<empty|recoil|bullet>,<193|195>,<xanim>[,<weight>[,<mag size (bullet) | rate (recoil)>]]
# additive=my_gun_zm,empty,193,vm_my_gun_empty_additive,1.0
# additive=my_gun_zm,bullet,195,vm_my_gun_bullets_additive,1.0,30

[ammo_hide]
# Needs a bullet line in [additives]; works with no lines of its own. Opt one gun out:
# auto_off = my_gun_zm

[kick]
# Lines for one gun. tools/iw8_wop_cfg.py prints them from an IW8 weapon dump:
# wop_weapon=my_gun_zm,<fire time ms>
# wop_kick=my_gun_zm,<ads>,<gun>,<bullet>,<dir>,<dev>,<sMin>,<sMax>,<pitchScale>
# wop=my_gun_zm,<14 numbers>
# wop_alias=my_gun_upgraded_zm,my_gun_zm

[camera]
# cam_shake=<gun>,<pitch/yaw>,<roll>,<origin>[,<pitchUp>]
# cam_shake=my_gun_zm,0.5,0.35,0.5,1

[locomotion]
# locomotion=<gun>,walk,bob,<strides>
# idle_active=<gun>,<xanim>,194
# locomotion=my_gun_zm,walk,bob,4
# idle_active=my_gun_zm,vm_my_gun_idle_active_additive,194

[inspect]
# guns = <gun>[:<seconds>], <gun>:off
# guns = my_gun_zm
# key = I

[last_shot]
# guns = <gun>:<auto|iw|hold>
# guns = my_gun_zm:hold

[empty_melee]
# interrupt_empty_melee = 1

[interrupts]
# interrupt=<gun>,<states joined by +>,<source chain joined by |>
# interrupt=my_gun_zm,raises+reload,notetrack|0.85

[segreload]
# guns = <gun>:<end|start|off>
# guns = my_shotgun_zm:end

[slide]
# Needs [features] slide = on. The defaults are the MW2019 slide.
# gesture = 1

[vmfov]
# Needs [features] vmfov = mw (or a number of degrees).
# depth = 20

[ik]
# Needs [features] ik = on.
# guns = <gun>:<l|r|lr>
# guns = my_gun_zm:lr
